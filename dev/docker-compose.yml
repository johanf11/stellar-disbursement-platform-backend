version: '3.8'
services:
  sdp-api:
    extends:
      file: docker-compose-sdp.yml
      service: sdp-api
  sdp-tss:
    extends:
      file: docker-compose-tss.yml
      service: sdp-tss
    depends_on:
      - sdp-api
  sdp-frontend:
    extends:
      file: docker-compose-frontend.yml
      service: sdp-frontend
    depends_on:
      - sdp-api
  demo-wallet:
    extends:
      file: docker-compose-sdp.yml
      service: demo-wallet
